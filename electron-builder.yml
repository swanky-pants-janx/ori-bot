appId: com.janx.ori
productName: Ori
copyright: Copyright © 2026 Janx
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
# No native dependencies (SQLite comes from Electron's built-in node:sqlite).
npmRebuild: false
asar: true
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.entertainment
  icon: build/icon.png
  extendInfo:
    # Run as a menu-bar/tray app without a Dock icon.
    LSUIElement: true
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  icon: build/icon.png
  category: Game
